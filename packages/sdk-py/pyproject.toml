[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-sdk-py"
version = "1.0.0"
description = "Operations Copilot Python SDK & AI Protocols"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25"
]

[project.optional-dependencies]
ai = [
    "langgraph>=0.0.10",
    "llama-index>=0.9.0"
]
